# Définition du projet Xcode, régénérée par `xcodegen` (voir mobile/ios/README.md).
#
# Pourquoi pas un .xcodeproj versionné : Xcode réécrit ce fichier en permanence,
# ses diffs sont illisibles et ses conflits ingérables. Ici la vérité tient en
# quelques lignes lisibles, et le projet se reconstruit à l'identique.
name: EcoBuilding
options:
  bundleIdPrefix: io.confinia
  deploymentTarget:
    iOS: "16.0"          # couvre l'iPhone 8 et au-delà : nos utilisateurs
                         # visitent des logements, pas des salons de la tech
  createIntermediateGroups: true

packages:
  # Carte 3D : la MÊME source de tuiles et la même expression de couleur DPE que
  # le web et le rendu PDF — une seule vérité visuelle pour les trois surfaces.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"

targets:
  EcoBuilding:
    type: application
    platform: iOS
    sources:
      - path: EcoBuilding/Sources
      - path: EcoBuilding/Assets.xcassets
    dependencies:
      - package: MapLibre
    settings:
      base:
        # Info.plist ENGENDRÉ depuis les clés ci-dessous : un plist versionné
        # de plus serait une seconde source de vérité, qui finit toujours par
        # diverger du project.yml.
        GENERATE_INFOPLIST_FILE: YES
        # HTTPS seulement : exemption standard. Sans cette clé, App Store
        # Connect repose la question du chiffrement à chaque envoi.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Équipe inscrite ICI et pas seulement dans l'interface : chaque
        # régénération du projet écrase les choix faits dans Xcode, et le
        # « Team » repassait à None sans prévenir.
        DEVELOPMENT_TEAM: "38WRV3R7D5"
        PRODUCT_BUNDLE_IDENTIFIER: io.confinia.ecobuilding
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"      # iPhone seulement en V1
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # La géolocalisation est LE service que le web ne rend pas : « quels
        # bâtiments autour de moi ». Le texte est vu par l'utilisateur ET par la
        # revue Apple — il doit dire l'usage réel, pas une formule creuse.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Pour afficher les bâtiments autour de vous et vous situer sur la carte.

  # Pilotage de l'app pour les essais de bout en bout. `simctl` sait lancer,
  # poser une position et capturer l'écran, mais ne sait pas TOUCHER : sans
  # cette cible, aucun parcours utilisateur ne peut être rejoué sur iPhone.
  # Elle tourne aussi bien sur simulateur que sur un appareil réel.
  EcoBuildingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EcoBuilding/UITests
    dependencies:
      - target: EcoBuilding
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "38WRV3R7D5"
        PRODUCT_BUNDLE_IDENTIFIER: io.confinia.ecobuilding.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: EcoBuilding

schemes:
  EcoBuilding:
    build:
      targets:
        EcoBuilding: all
        EcoBuildingUITests: [test]
    test:
      targets:
        - EcoBuildingUITests
